      lumaglowapi.color.aqua: true
      lumaglowapi.color.red: true
      lumaglowapi.color.light_purple: true
      lumaglowapi.color.yellow: true
      lumaglowapi.color.white: true
      lumaglowapi.color.custom: true
      lumaglowapi.color.preset.rainbow: true
      lumaglowapi.color.preset.rainbow_slow: true
      lumaglowapi.color.preset.rainbow_fast: true
      lumaglowapi.color.preset.fire: true
      lumaglowapi.color.preset.sunset: true
      lumaglowapi.color.preset.forest: true
      lumaglowapi.color.preset.acid: true
      lumaglowapi.color.preset.ocean: true
      lumaglowapi.color.preset.ice: true
      lumaglowapi.color.preset.galaxy: true
      lumaglowapi.color.preset.candy: true
      lumaglowapi.color.preset.pulse_red: true
