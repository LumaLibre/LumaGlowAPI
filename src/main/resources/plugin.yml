      lumaglowapi.color.preset.pulse_yellow: true
      lumaglowapi.color.preset.mistral: true
      lumaglowapi.color.preset.mistral_slow: true
  lumaglowapi.color.custom:
    description: Allows RGB colors and custom rainbow / gradient / pulse effects
    default: op
